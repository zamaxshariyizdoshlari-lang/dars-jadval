name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase so the free project is not auto-paused
        env:
          SUPABASE_URL: https://sspvboeooadvbqqgsuxi.supabase.co
          # Public anon key (the same one embedded in index.html)
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzcHZib2Vvb2FkdmJxcWdzdXhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMjQ0OTQsImV4cCI6MjEwMjYwMDQ5NH0.xTVMB3XtoEC8DHy0zLoz15Xit0oydZzCueGld_Go8OU
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/schedule_touch?select=id&limit=1")
          echo "Supabase responded: HTTP $code"
          if [ "$code" != "200" ]; then exit 1; fi
